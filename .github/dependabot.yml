version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: bundler
    directory: /packages/mobile
    schedule:
      interval: weekly
    groups:
      ruby-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /packages/mobile/android
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
