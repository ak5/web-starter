name: migrate-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm caddy lefthook ripgrep
      - run: nice -n 10 pnpm install --frozen-lockfile
      - run: nice -n 10 pnpm --filter @ak5/api db:check
      - run: nice -n 10 pnpm db:migrate
      - run: nice -n 10 pnpm db:migrate
