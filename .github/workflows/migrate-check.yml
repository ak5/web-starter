name: migrate-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm caddy lefthook ripgrep
      - run: nice -n 10 pnpm install --frozen-lockfile
      - run: nice -n 10 pnpm --filter @ak5/api db:check
      - run: nice -n 10 pnpm db:migrate
      - run: nice -n 10 pnpm db:migrate
