name: migrate-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm caddy lefthook ripgrep
      - run: nice -n 10 pnpm install --frozen-lockfile
      - run: nice -n 10 pnpm --filter @ak5/api db:check
      - run: nice -n 10 pnpm db:migrate
      - run: nice -n 10 pnpm db:migrate
