name: development
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: development
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  deploy:
    needs: test
    if: vars.HOSTED_DEV != 'false'
    uses: ./.github/workflows/deploy-workers.yml
    with:
      sha: ${{ github.sha }}
      target: development
    secrets: inherit
