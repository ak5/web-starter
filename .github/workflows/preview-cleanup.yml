name: preview-cleanup
on:
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.DEPLOY_WORKERS == 'true' && vars.HOSTED_DEV != 'false' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: Dev Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Only trusted base code runs with secrets, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm caddy lefthook ripgrep
      - run: nice -n 10 pnpm install --frozen-lockfile
      - run: node scripts/configure-preview.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: |
          for app in api web admin; do
            nice -n 10 pnpm --filter "@ak5/$app" exec wrangler delete --env development --force
          done
