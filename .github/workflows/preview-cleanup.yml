name: preview-cleanup
on:
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.DEPLOY_WORKERS == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Staging Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Only trusted base code runs with secrets, never the PR head.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: jdx/mise-action@v2
      - run: nice -n 10 pnpm install --frozen-lockfile
      - run: node scripts/configure-preview.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: |
          for app in api web admin; do
            pnpm --filter "@ak5/$app" exec wrangler delete --env staging --force
          done
