name: preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  preview:
    if: vars.DEPLOY_WORKERS == 'true' && vars.HOSTED_DEV != 'false' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Dev Cloudflare
      url: ${{ steps.urls.outputs.web }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm caddy lefthook ripgrep
      - run: nice -n 10 pnpm install --frozen-lockfile

      - name: Configure D1 binding
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/configure-d1.mjs

      - name: Configure optional email sender
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: node scripts/configure-email-sender.mjs

      - name: Configure private attachments
        env:
          PRIVATE_ATTACHMENTS_BUCKET: ${{ vars.PRIVATE_ATTACHMENTS_BUCKET }}
        run: node scripts/configure-private-attachments.mjs

      - name: Configure non-production asset URL
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: node scripts/configure-asset-url.mjs

      - name: Configure PR Workers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/configure-preview.mjs
          node --input-type=module <<'JS' >> "$GITHUB_ENV"
          import { readFileSync } from 'node:fs';
          const vars = JSON.parse(readFileSync('packages/api/wrangler.jsonc', 'utf8')).env.development.vars;
          console.log(`SMOKE_APP_URL=${vars.PUBLIC_APP_URL}`);
          console.log(`SMOKE_ADMIN_URL=${vars.PUBLIC_ADMIN_URL}`);
          JS

      - name: Build browser Workers and shared libraries
        env:
          CLOUDFLARE_ENV: development
        run: nice -n 10 pnpm build:frontends

      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nice -n 10 pnpm --filter @ak5/api exec wrangler deploy --env development

      - name: Deploy Web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nice -n 10 pnpm --filter @ak5/web exec wrangler deploy

      - name: Deploy Admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: nice -n 10 pnpm --filter @ak5/admin exec wrangler deploy

      # Push the GitHub Environment secrets onto the Workers (the source of truth
      # for runtime secrets). Runs after deploy so the first run can auto-create
      # the Workers; idempotent on every subsequent deploy.
      - name: Sync Cloudflare Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: bash scripts/sync-cloudflare-worker-secrets.sh --env development
      - name: Check deployed frontend runtime
        run: node scripts/check-frontend-runtime.mjs "$SMOKE_APP_URL" "$SMOKE_ADMIN_URL"

      - name: Preview URLs
        id: urls
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync, appendFileSync } from 'node:fs';
          console.log('### PR preview (shared development database)');
          for (const app of ['api', 'web', 'admin']) {
            const config = JSON.parse(readFileSync('packages/api/wrangler.jsonc', 'utf8'));
            if (app === 'web') appendFileSync(process.env.GITHUB_OUTPUT, `web=${config.env.development.vars.PUBLIC_APP_URL}\n`);
            console.log(`- ${app}: ${config.env.development.vars[app === 'api' ? 'PUBLIC_API_URL' : app === 'web' ? 'PUBLIC_APP_URL' : 'PUBLIC_ADMIN_URL']}`);
          }
          JS
