packages:
  - packages/*
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
engineStrict: true
updateNotifier: false
workspaceConcurrency: 1
overrides:
  # Native hosts use React Native CLI; Expo's CLI and its signing dependencies are unnecessary.
  'expo>@expo/cli': '-'
  # Drizzle Kit ships its own config loader and also supports the installed tsx.
  'drizzle-kit>@esbuild-kit/esm-loader': '-'
  '@livestore/utils>nanoid': '^5.1.16'
  '@opentelemetry/core@>=2.0.0 <2.8.0': '^2.8.0'
  '@tailwindcss/typography>postcss-selector-parser': '^7.1.6'
  # Keep Symbiote's native dependencies on the host's React Native and Expo SDK versions.
  '@symbiote-native/components>@react-native/virtualized-lists': '0.88.0'
  '@symbiote-native/engine>@react-native/normalize-colors': '0.88.0'
  '@symbiote-native/css-parser>@react-native/metro-babel-transformer': '0.88.0'
  '@symbiote-native/secure-store>expo-modules-core': '58.0.24'
  '@symbiote-native/secure-store>expo-secure-store': '58.0.2'
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
patchedDependencies:
  '@livestore/adapter-expo@0.5.0': patches/@livestore__adapter-expo@0.5.0.patch
  # shortcut: RN/Expo pin Kotlin 2.2; keep compiler patches until upstream supports Gradle 9.8.
  '@react-native/gradle-plugin@0.88.0': patches/@react-native__gradle-plugin@0.88.0.patch
  expo-modules-autolinking@58.0.14: patches/expo-modules-autolinking@58.0.14.patch
  expo-modules-core@58.0.24: patches/expo-modules-core@58.0.24.patch

# LiveStore uses the same synchronous SQLite/Application APIs provided by Expo 58.
# Native build and persistence tests verify this host combination.
peerDependencyRules:
  allowedVersions:
    '@livestore/adapter-expo>expo-application': '58.1.2'
    '@livestore/adapter-expo>expo-sqlite': '58.0.13'

publicHoistPattern:
  - '*react-native*'
  - 'expo-*'
  - '*react*'
  - '*@react-email/*'
# These exact current releases are included in the verified dependency upgrade.
minimumReleaseAgeExclude:
  - '@babel/core@8.0.9'
  - '@babel/helper-string-parser@8.0.8'
  - '@babel/helpers@8.0.8'
  - '@babel/parser@8.0.8'
  - '@babel/runtime@8.0.8'
  - '@babel/types@8.0.8'
  - '@cloudflare/workers-types@5.20261023.1'
  - runed@0.38.0
  - undici@7.30.1
  - fast-uri@3.1.9
